[project]
name = "cicids2017"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "imbalanced-learn>=0.14.2",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.2",
    "numpy>=2.4.6",
    "pandas>=3.1.1",
    "pandoc>=2.4",
    "psutil>=7.2.2",
    "pyarrow>=26.0.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "shap>=0.51.0",
    "xgboost>=2.0",
]

[dependency-groups]
dev = [
    "dvc>=3.67.1",
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.6",
]

